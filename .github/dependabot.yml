version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      test-deps:
        patterns: ["*"]
    # The Home Assistant version is deliberately unpinned; the floor is tested in CI.
    ignore:
      - dependency-name: homeassistant
    open-pull-requests-limit: 5
